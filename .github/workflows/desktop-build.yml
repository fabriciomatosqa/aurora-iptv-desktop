name: AURORA IPTV Desktop - builds

on:
  workflow_dispatch:
    inputs:
      approve_stable:
        description: "Autorizar publicação estável (apenas versão sem beta/rc)"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'aurora_desktop/**'
      - 'tests/**'
      - 'run.py'
      - 'build_assets.py'
      - 'build_version.py'
      - 'requirements*.txt'
      - 'build_windows.ps1'
      - '.github/scripts/**'
      - 'build_linux.sh'
      - 'installer_windows.iss'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test catalog and updater
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest tests -q
      - name: Verify real GitHub installer download (bytes and SHA-256)
        shell: pwsh
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/verify-release-download.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build EXE and installer
        shell: pwsh
        run: ./build_windows.ps1
      - name: Verify real silent install and restart
        shell: pwsh
        timeout-minutes: 6
        run: ./.github/scripts/test-silent-update.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AURORA-IPTV-Windows-Setup
          path: installer_out/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OS libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libpulse0 libdbus-1-3
      - name: Test catalog and updater
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest tests -q
      - name: Verify real Debian download (full bytes and SHA-256)
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 7
        run: python .github/scripts/verify-release-download.py --linux
      - name: Build DEB and portable TAR.GZ
        run: bash build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AURORA-IPTV-Linux
          path: |
            releases/*.deb
            releases/*.tar.gz
          if-no-files-found: error

  publish-release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.approve_stable)
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: AURORA-IPTV-*
          path: release-assets
          merge-multiple: true
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE_APPROVAL: ${{ inputs.approve_stable }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c "from aurora_desktop import __version__; print(__version__)")
          TAG="v${VERSION}"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "New commits landed; avoid publishing older binaries under this version."
            exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists; keep it and all prior versions unchanged."
            exit 0
          fi
          test -f release-assets/AURORA-IPTV-Desktop-Setup.exe
          test -f release-assets/AURORA-IPTV-Desktop-linux-x86_64.tar.gz
          test -n "$(find release-assets -name 'aurora-iptv_*_amd64.deb' -print -quit)"
          (cd release-assets && sha256sum AURORA-IPTV-Desktop-Setup.exe AURORA-IPTV-Desktop-linux-x86_64.tar.gz aurora-iptv_*_amd64.deb > SHA256SUMS.txt)
          if [[ "$VERSION" == *-beta.* || "$VERSION" == *-rc.* ]]; then
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "AURORA IPTV Desktop $VERSION (teste)" \
              --notes-file docs/RELEASE_NOTES.md --prerelease --latest=false
          else
            if [ "$STABLE_APPROVAL" != "true" ]; then
              echo "Stable releases require explicit workflow_dispatch approval."
              exit 0
            fi
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "AURORA IPTV Desktop $VERSION" \
              --notes-file docs/RELEASE_NOTES.md --latest=true
          fi
